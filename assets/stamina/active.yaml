version: 1

defaults:
  activity_section:
    expected: ["限时活动"]
    roi: [480, 90, 150, 80]
  activity_name_roi: [70, 770, 580, 60]
  stage_roi: [0, 160, 720, 1000]
  stamina_roi: [500, 0, 180, 45]
  reserve: 0

templates:
  regular_paged_list:
    route_type: normal_list
    extra_overrides:
      DailyStaminaPresetInnerRouteStart:
        next: ["DailyStaminaRouteRegularPagedFirstPageStart"]

  rerun_activity_map:
    route_type: rerun_map

  large_activity_stage_icon:
    route_type: special_icon

  large_activity_direct_stage:
    route_type: challenge_button

  daily_affairs_list:
    route_type: daily_affairs

activities:
  - name: "常驻关卡 - 战争演习-特IV"
    description: "常驻路线：目前活动 → 日常政务 → 战争演习，进入纵向关卡列表后寻找战争演习-特IV。"
    template: daily_affairs_list
    activity_section:
      expected: ["目前活动"]
      roi: [270, 90, 180, 80]
    activity_name:
      expected: ["日常政务"]
      roi: [60, 740, 300, 110]
    daily_affairs:
      category:
        expected: ["战争演习"]
        roi: [350, 120, 300, 1120]
    stage:
      expected: ["战争演习-特IV", "战争演习-特Ⅳ"]
      any_selectable:
        expected: ["Lv.10", "Lv.15", "Lv.20", "Lv.30", "Lv.45", "Lv.60"]
        roi: [70, 80, 120, 1080]
    stamina:
      cost: 4

activity_groups:
  trick_or_sweet:
    case_prefix: "Trick or Sweet"
    description_template: "限时活动外部路线 + 常规活动纵向关卡列表：选择 {activity}，进入关卡列表后寻找{stage}，刷取{stage}。"
    base:
      template: regular_paged_list
      stamina:
        cost: 30
      activity_name:
        expected: ["^Trick or Sweet$"]
        roi: [70, 770, 580, 80]
      stage:
        any_selectable:
          expected: ["Trick or Sweet", "活动挑战还有"]
          roi: [0, 90, 720, 180]
      extra_overrides:
        DailyStaminaPresetFirstPageMarker:
          enabled: true
          recognition:
            type: OCR
            param:
              expected:
                [
                  "研究-01",
                  "研究01",
                  "基金-01",
                  "基金01",
                  "法令-01",
                  "法令01",
                  "南瓜-01",
                  "南瓜01",
                  "糖果-01",
                  "糖果01",
                  "捣蛋-01",
                  "捣蛋01",
                ]
              roi: [0, 160, 720, 1000]
    cases:
      - case_suffix: "研究-01"
        stage:
          expected: ["研究-01", "研究01"]
        stamina:
          cost: 25
      - case_suffix: "基金-01"
        stage:
          expected: ["基金-01", "基金01"]
      - case_suffix: "法令-01"
        stage:
          expected: ["法令-01", "法令01"]
      - case_suffix: "南瓜-01"
        stage:
          expected: ["南瓜-01", "南瓜01"]
      - case_suffix: "糖果-01"
        stage:
          expected: ["糖果-01", "糖果01"]
      - case_suffix: "捣蛋-01"
        stage:
          expected: ["捣蛋-01", "捣蛋01"]
        stamina:
          cost: 45
