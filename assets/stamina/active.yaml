version: 1

defaults:
  activity_section:
    expected: ["限时活动"]
    roi: [480, 90, 150, 80]
  activity_name_roi: [70, 770, 580, 60]
  stage_roi: [0, 160, 720, 1000]
  stamina_roi: [500, 0, 180, 45]
  reserve: 0

templates:
  regular_paged_list:
    route_type: normal_list
    extra_overrides:
      DailyStaminaPresetInnerRouteStart:
        next: ["DailyStaminaRouteRegularPagedFirstPageStart"]

  rerun_activity_map:
    route_type: rerun_map

  large_activity_stage_icon:
    route_type: special_icon

  large_activity_direct_stage:
    route_type: challenge_button

  daily_affairs_list:
    route_type: daily_affairs

activities:
  - name: "常驻关卡 - 战争演习-特IV"
    description: "常驻路线：目前活动 → 日常政务 → 战争演习，进入纵向关卡列表后寻找战争演习-特IV。"
    template: daily_affairs_list
    activity_section:
      expected: ["目前活动"]
      roi: [270, 90, 180, 80]
    activity_name:
      expected: ["日常政务"]
      roi: [60, 740, 300, 110]
    daily_affairs:
      category:
        expected: ["战争演习"]
        roi: [350, 120, 300, 1120]
    stage:
      expected: ["战争演习-特IV", "战争演习-特Ⅳ"]
      any_selectable:
        expected: ["Lv.10", "Lv.15", "Lv.20", "Lv.30", "Lv.45", "Lv.60"]
        roi: [70, 80, 120, 1080]
    stamina:
      cost: 4

activity_groups:
  halloween_deer_rerun:
    case_prefix: "万圣鹿娘大横行！"
    description_template: "复刻活动二维地图：选择 {activity}，进入{stage}并扫荡。"
    base:
      template: rerun_activity_map
      activity_name:
        expected: ["万圣鹿娘大横行！"]
        roi: [70, 770, 580, 80]
      rerun:
        marker:
          expected: ["Story", "Free Quest"]
          roi: [0, 160, 720, 1000]
        column: left
      stamina:
        cost: 30
    cases:
      - case_suffix: "关卡-1"
        stage:
          expected: ["关卡-1"]
      - case_suffix: "关卡-2"
        stage:
          expected: ["关卡-2"]
      - case_suffix: "关卡-3"
        stage:
          expected: ["关卡-3"]
      - case_suffix: "关卡-4"
        stage:
          expected: ["关卡-4"]
      - case_suffix: "关卡-5"
        stage:
          expected: ["关卡-5"]
      - case_suffix: "陷阱-1"
        rerun:
          column: right
        stage:
          expected: ["陷阱-1"]
        stamina:
          cost: 50
      - case_suffix: "陷阱-2"
        rerun:
          column: right
        stage:
          expected: ["陷阱-2"]
        stamina:
          cost: 50
      - case_suffix: "陷阱-3"
        rerun:
          column: right
        stage:
          expected: ["陷阱-3"]
        stamina:
          cost: 50
      - case_suffix: "陷阱-4"
        rerun:
          column: right
        stage:
          expected: ["陷阱-4"]
        stamina:
          cost: 50
      - case_suffix: "陷阱-5"
        rerun:
          column: right
        stage:
          expected: ["陷阱-5"]
        stamina:
          cost: 50
