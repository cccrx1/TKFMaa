version: 1

activity_groups:
  blade_dance:
    case_prefix: "刀剑魔舞"
    description_template: "限时活动外部路线 + 常规活动纵向关卡列表：选择 {activity}，进入关卡列表后寻找{stage}，刷取{stage}。"
    base:
      template: regular_paged_list
      stamina:
        cost: 30
      activity_name:
        expected: ["刀剑魔舞"]
        roi: [70, 770, 580, 80]
      stage:
        any_selectable:
          expected: ["刀剑魔舞", "活动挑战还有"]
          roi: [0, 90, 720, 180]
      extra_overrides:
        DailyStaminaPresetFirstPageMarker:
          enabled: true
          recognition:
            type: OCR
            param:
              expected: ["觉醒-01", "觉醒01", "磨刀-01", "磨刀01", "保养-01", "保养01", "修行-01", "修行01"]
              roi: [0, 160, 720, 1000]
    cases:
      - case_suffix: "觉醒-01"
        stage:
          expected: ["觉醒-01", "觉醒01"]
        stamina:
          cost: 25
      - case_suffix: "磨刀-01"
        stage:
          expected: ["磨刀-01", "磨刀01"]
      - case_suffix: "保养-01"
        stage:
          expected: ["保养-01", "保养01"]
      - case_suffix: "修行-01"
        stage:
          expected: ["修行-01", "修行01"]
        stamina:
          cost: 45
