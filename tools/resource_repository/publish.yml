# Install as .github/workflows/publish.yml in the approved update repository.
name: Prepare or publish TKFMaa update

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed 40-character commit in cccrx1/TKFMaa
        required: true
        type: string
      version:
        description: Explicit project version, such as v1.2.3-beta.1
        required: true
        type: string
      kind:
        description: Package kind
        required: true
        type: choice
        options: [resource, full-mirror]
      publish:
        description: Publish after exact manifest acceptance; false only builds Artifact
        required: true
        default: false
        type: boolean
      acceptance_json:
        description: Acceptance JSON for the prepared manifest; required only to publish
        required: false
        type: string
      release_notes:
        description: Reviewed release notes; required only to publish
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate source input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          repository: cccrx1/TKFMaa
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and prepare attachments
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_KIND: ${{ inputs.kind }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m pip install -r tools/requirements.txt
          npm ci
          python tools/configure.py --download
          python tools/release_support.py
          python tools/build_stamina_activities.py --check
          python tools/add_interaction_stability.py --check
          python tools/check_environment.py --load-resource
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json
          python -c "import sys; sys.path.insert(0, 'agent'); import main"
          npx @nekosu/maa-tools check
          if [[ "$PACKAGE_KIND" == "resource" ]]; then
            for os in win macos linux; do
              for arch in x86_64 aarch64; do
                python tools/package_resources.py --version "$RELEASE_VERSION" --os "$os" --arch "$arch" --update-repository "$UPDATE_REPOSITORY"
              done
            done
            python tools/prepare_resource_release.py --input build/resources --output build/prepared --version "$RELEASE_VERSION" --repository "$UPDATE_REPOSITORY" --source-sha "$SOURCE_SHA"
          else
            python tools/mirror_full_release.py --output build/prepared --version "$RELEASE_VERSION" --repository "$UPDATE_REPOSITORY" --source-sha "$SOURCE_SHA"
          fi
          sha256sum build/prepared/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-update
          path: build/prepared/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: tkfmaa-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cccrx1/TKFMaa
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare verification dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/configure.py --download
      - uses: actions/download-artifact@v4
        with:
          name: prepared-update
          path: build/prepared
      - name: Write explicit review inputs
        env:
          ACCEPTANCE_JSON: ${{ inputs.acceptance_json }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python -c "import os,pathlib; pathlib.Path('build/acceptance.json').write_text(os.environ['ACCEPTANCE_JSON'],encoding='utf-8'); pathlib.Path('build/notes.md').write_text(os.environ['RELEASE_NOTES'],encoding='utf-8')"
      - name: Verify draft and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TKFMAA_RELEASE_CONCURRENCY: tkfmaa-release-publish
          TKFMAA_CHANNEL_BASELINE_SHA256: ${{ vars.TKFM_CHANNEL_BASELINE_SHA256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: >-
          python tools/publish_resource_release.py --publish --prepared build/prepared
          --repository "$UPDATE_REPOSITORY" --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA"
          --notes-file build/notes.md --acceptance-file build/acceptance.json
