name: install

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  # 版本控制：
  # - 设置 VERSION 为空字符串时，下载 latest 版本
  # - 设置 VERSION 为具体版本号时（如 v1.2.3），下载指定版本
  MAAFW_VERSION: "v5.14.3"
  MFAA_VERSION: "v2.16.2"
  PYTHON_VERSION: "3.12"
  PYTHON_ABI: "cp312"

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "tools/install.py"
      - "tools/package_resources.py"
      - "tools/release_support.py"
      - "tools/release_baseline.json"
      - "tools/record_full_package.py"
      - "tools/frontend_build.py"
      - "tools/frontend_release.json"
      - "tools/frontend_candidate/**"
      - "tools/prepare_frontend_candidate.py"
      - "tools/stage_frontend_release.py"
      - "tools/release_preflight.py"
      - "tools/clean_package_stage.py"
      - "tools/releases/**"
      - "docs/zh_cn/releases/**"
      - "tools/configure.py"
      - "tools/check_environment.py"
      - "tools/requirements.txt"
      - "tools/ocr_model.json"
      - "maatools.config.mts"
      - ".python-version"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "tools/install.py"
      - "tools/package_resources.py"
      - "tools/release_support.py"
      - "tools/release_baseline.json"
      - "tools/record_full_package.py"
      - "tools/frontend_build.py"
      - "tools/frontend_release.json"
      - "tools/frontend_candidate/**"
      - "tools/prepare_frontend_candidate.py"
      - "tools/stage_frontend_release.py"
      - "tools/release_preflight.py"
      - "tools/clean_package_stage.py"
      - "tools/releases/**"
      - "docs/zh_cn/releases/**"
      - "tools/configure.py"
      - "tools/check_environment.py"
      - "tools/requirements.txt"
      - "tools/ocr_model.json"
      - "maatools.config.mts"
      - ".python-version"
  workflow_dispatch:
    inputs:
      preview_version:
        description: 发布前预演版本（如 v1.0.8），仅 Artifact，必须有对应发布计划
        required: false
        default: ""
        type: string
      update_repository:
        description: 可选更新源，仅影响生成包；不迁移已有客户端
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: set_tag
        env:
          PREVIEW_VERSION: ${{ inputs.preview_version }}
        run: |
          # 检查标签格式
          is_release=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --long --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if [[ "$is_release" == "true" ]]; then
            tag="${{ github.ref_name }}"
          else
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            # 保留预发布序号的数字类型，避免 beta.1-ci 被判为高于 beta.8。
            separator="-"
            [[ "$prefix" == *-* ]] && separator="."
            tag="$prefix${separator}ci.${suffix//-/.}"
          fi

          if [[ -n "$PREVIEW_VERSION" ]]; then
            python tools/release_preflight.py --version "$PREVIEW_VERSION"
            tag="$PREVIEW_VERSION"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag == *-* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: win
            arch: x86_64
            python_platform: win_amd64
            numpy_platform: win_amd64
            python_target: x86_64-pc-windows-msvc
            python_site_packages: install/python/Lib/site-packages
            python_executable: install/python/python.exe
          - os: win
            arch: aarch64
            python_platform: win_arm64
            numpy_platform: win_arm64
            python_target: aarch64-pc-windows-msvc
            python_site_packages: install/python/Lib/site-packages
            python_executable: install/python/python.exe
          - os: macos
            arch: x86_64
            python_platform: macosx_13_0_x86_64
            numpy_platform: macosx_13_0_x86_64
            python_target: x86_64-apple-darwin
            python_site_packages: install/python/lib/python3.12/site-packages
            python_executable: install/python/bin/python3
          - os: macos
            arch: aarch64
            python_platform: macosx_13_0_arm64
            numpy_platform: macosx_13_0_arm64
            python_target: aarch64-apple-darwin
            python_site_packages: install/python/lib/python3.12/site-packages
            python_executable: install/python/bin/python3
          - os: linux
            arch: x86_64
            python_platform: manylinux2014_x86_64
            numpy_platform: manylinux_2_27_x86_64
            python_target: x86_64-unknown-linux-gnu
            python_site_packages: install/python/lib/python3.12/site-packages
            python_executable: install/python/bin/python3
          - os: linux
            arch: aarch64
            python_platform: manylinux2014_aarch64
            numpy_platform: manylinux_2_27_aarch64
            python_target: aarch64-unknown-linux-gnu
            python_site_packages: install/python/lib/python3.12/site-packages
            python_executable: install/python/bin/python3
          - os: android
            arch: x86_64
          - os: android
            arch: aarch64
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        id: download_maafw
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Set up frontend SDK
        if: matrix.os != 'android'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.403"

      - name: Download portable Python
        if: matrix.os != 'android'
        uses: robinraju/release-downloader@v1
        with:
          repository: astral-sh/python-build-standalone
          fileName: "cpython-${{ env.PYTHON_VERSION }}.*-${{ matrix.python_target }}-install_only_stripped.tar.gz"
          latest: true
          out-file-path: "python-runtime"
          extract: true
          extract-path: "install"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Build and stage pinned patched frontend
        if: matrix.os != 'android'
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $frontend = Get-Content tools/frontend_candidate/manifest.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri "https://github.com/$($frontend.repository)/archive/$($frontend.revision).zip" -OutFile build/frontend-source.zip
          python tools/prepare_frontend_candidate.py --source-zip build/frontend-source.zip --output build/frontend-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platform = "${{ (matrix.os == 'macos' && 'osx') || matrix.os }}-${{ (matrix.arch == 'x86_64' && 'x64') || 'arm64' }}"
          dotnet publish build/frontend-source/MFAAvalonia.Desktop/MFAAvalonia.Desktop.csproj -c Release -r $platform -o build/frontend-published -p:UsedAvaloniaProducts=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/stage_frontend_release.py --source build/frontend-source --published build/frontend-published --platform $platform --output MFA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: |
          rm -rf MFA/runtimes

      - name: Install
        shell: bash
        env:
          UPDATE_REPOSITORY: ${{ inputs.update_repository || vars.TKFM_UPDATE_REPOSITORY }}
        run: |
          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./check_environment.py
          python ./configure.py --download
          args=()
          if [[ -n "$UPDATE_REPOSITORY" ]]; then
            args+=(--update-repository "$UPDATE_REPOSITORY")
          fi
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }} "${args[@]}"
          cd ..

      - name: Bundle Python dependencies
        if: matrix.os != 'android'
        shell: bash
        run: |
          MAAFW_VERSION="${{ steps.download_maafw.outputs.tag_name }}"
          MAAFW_VERSION="${MAAFW_VERSION#v}"
          if [[ -z "${MAAFW_VERSION}" ]]; then
            echo "The downloaded MaaFramework release did not provide a version tag."
            exit 1
          fi

          # MaaFw wheels contain another copy of the native runtime. The Agent
          # uses MAAFW_BINARY_PATH to share the runtime already bundled for MFA.
          python -m pip install \
            --target "${{ matrix.python_site_packages }}" \
            --no-deps \
            --only-binary=:all: \
            --platform "${{ matrix.python_platform }}" \
            --python-version "${{ env.PYTHON_VERSION }}" \
            --implementation cp \
            --abi "${{ env.PYTHON_ABI }}" \
            "maafw==${MAAFW_VERSION}"

          python -m pip install \
            --target "${{ matrix.python_site_packages }}" \
            --no-deps \
            --only-binary=:all: \
            --platform "${{ matrix.numpy_platform }}" \
            --python-version "${{ env.PYTHON_VERSION }}" \
            --implementation cp \
            --abi "${{ env.PYTHON_ABI }}" \
            "$(python tools/release_support.py --runtime-requirement numpy)"

          python -m pip install \
            --target "${{ matrix.python_site_packages }}" \
            --no-deps \
            --only-binary=:all: \
            --platform any \
            --python-version "${{ env.PYTHON_VERSION }}" \
            "$(python tools/release_support.py --runtime-requirement maaagentbinary)" \
            "$(python tools/release_support.py --runtime-requirement strenum)"

          rm -rf "${{ matrix.python_site_packages }}/maa/bin"

      - name: Remove disposable package files
        if: matrix.os != 'android'
        run: python tools/clean_package_stage.py --stage install

      - name: Verify packaged runtime
        if: matrix.os != 'android'
        shell: bash
        run: |
          test -f "${{ matrix.python_executable }}"
          test -f "${{ matrix.python_site_packages }}/maa/__init__.py"
          test -d "${{ matrix.python_site_packages }}/numpy"
          test ! -d "${{ matrix.python_site_packages }}/maa/bin"
          test -d "install/runtimes/${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || 'linux' }}-${{ (matrix.arch == 'x86_64' && 'x64') || 'arm64' }}/native"
          grep -Fq '"child_exec": "./python/' install/interface.json

      - name: Record full package provenance
        if: matrix.os != 'android'
        run: >-
          python tools/record_full_package.py
          --version ${{ needs.meta.outputs.tag }}
          --os ${{ matrix.os }} --arch ${{ matrix.arch }}
          --source-sha ${{ github.sha }} --require-frontend-build
          ${{ needs.meta.outputs.is_release != 'true' && '--rehearsal' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: TKFMaa-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"
          include-hidden-files: true

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  preview-verification:
    if: ${{ inputs.preview_version != '' }}
    needs: [meta, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: build/release-preview
      - name: Verify preview identities and hashes
        run: >-
          python tools/release_preflight.py --version ${{ needs.meta.outputs.tag }}
          --artifacts build/release-preview --source-sha ${{ github.sha }}
          --expect-rehearsal --output build/release-preview-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ needs.meta.outputs.tag }}
          path: build/release-preview-verification.json

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Verify release plan and all desktop artifacts
        run: >-
          python tools/release_preflight.py --version ${{ needs.meta.outputs.tag }}
          --artifacts assets --source-sha ${{ github.sha }}

      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body_path: docs/zh_cn/releases/${{ needs.meta.outputs.tag }}.md
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
