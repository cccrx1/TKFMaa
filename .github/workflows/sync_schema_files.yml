name: Sync JSON Schema Files from MaaFramework

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schema-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download version-matched JSON schemas
        run: python tools/sync_schemas.py

      - name: Validate resources with downloaded schemas
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json

      - name: Commit and Push Changes
        run: |
          if git diff --quiet -- deps/tools; then
            echo "No schema changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deps/tools/*.schema.json
          git commit -m "chore(schema): 同步项目固定版本的六份校验文件"
          git push
