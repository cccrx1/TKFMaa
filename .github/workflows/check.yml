name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "tools/requirements.txt"
      - "tools/ocr_model.json"
      - ".github/workflows/install.yml"
      - ".python-version"
      - "maatools.config.mts"
      - "package.json"
      - "package-lock.json"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "tools/requirements.txt"
      - "tools/ocr_model.json"
      - ".github/workflows/install.yml"
      - ".python-version"
      - "maatools.config.mts"
      - "package.json"
      - "package-lock.json"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run maa-checker
        run: |
          npm ci
          npx @nekosu/maa-tools check

      - name: Check interaction stability
        run: python tools/add_interaction_stability.py --check

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Validate JSON Schema
        run: python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json

      - name: Check generated activities
        run: python tools/build_stamina_activities.py --check

      - name: Verify environment and load resource bundle
        run: |
          python -m pip check
          python tools/configure.py --download
          python tools/check_environment.py --load-resource

      - name: Check Agent registration
        run: python -c "import sys; sys.path.insert(0, 'agent'); import main; print('Agent imports OK')"

      # Unit tests are maintained locally and are not included in this checkout.
