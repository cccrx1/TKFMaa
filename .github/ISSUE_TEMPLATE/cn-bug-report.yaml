name: Bug 反馈（使用中文）
description: 识别错误、操作异常、连接错误等
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 在提问之前...
      description: |
        请确认自己完成了要求之后再进行勾选
      options:
        - label: 我理解 Issue 是用于反馈和解决问题的，而非吐槽评论区，将尽可能提供更多信息帮助问题解决
          required: true
        - label: 我填写了简短且清晰明确的标题，以便开发者在翻阅 Issue 列表时能快速确定大致问题。而不是“一个建议”、“卡住了”等
          required: true
        - label: 我使用的是当前更新版本的最新版，且已查看版本发布至今和 Pull Requests 中尚未发布的更新内容，并未提及该 Bug 已被修复的情况
          required: true
        - label: 我已检查了置顶议题（Pinned Issue）（公告）、活跃议题（Open Issue）、已关闭议题（Closed Issue），确认我的问题未被提及
          required: true
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 请说明运行的任务、起始页面、相关选项、复现步骤，以及实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: >-
        请提供 TKFMaa 版本
      placeholder: |
        TKFMaa Version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 发生时间与相关日志（选填）
      description: |
        如果记得，请写下问题发生的日期、大致时间和时区。关闭 TKFMaa 后，可从项目根目录的 `maafw.log`、
        轮转日志或 `debug` 中选取故障前后相关的片段，保留时间戳、任务名和错误上下文。
        macOS 可通过「文件 → 打开日志文件夹」找到日志。

        这是公开 Issue。发布前请移除或遮盖账号、角色名、令牌、设备序列号和个人路径。
        涉及配置时，只在正文写出必要的选项及其脱敏值。请勿上传完整日志、原始配置或整个 `debug` 目录。
    validations:
      required: false
  - type: textarea
    id: configuration
    attributes:
      label: 配置信息
      description: |
        请说明操作系统及版本、模拟器品牌、模拟器分辨率、DPI、帧率；
        若正在使用 MuMu 12 或雷电 9，请说明截图增强是否开启；
        最后请说明 GPU 加速推理是否开启，若开启请提供 GPU 型号。
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 相关截图或录屏（选填）
      description: |
        请仅附与问题相关的画面，可从 `debug` 目录选取相关错误截图。
        若方便复现，可将 `config/maa_option.json` 中的 `save_draw` 设为 `true`，重新运行以获取识别调试截图。
        识别问题优先使用模拟器自带工具或 ADB 截取游戏画面。上传前请遮盖隐私信息，并尽量保留识别目标和画面原始分辨率。
    validations:
      required: false
  - type: textarea
    id: others
    attributes:
      label: 还有别的吗？
      description: |
        任何能让我们对你所遇到的问题有更多了解的东西
    validations:
      required: false
