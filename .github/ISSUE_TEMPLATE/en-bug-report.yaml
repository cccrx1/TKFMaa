name: Bug Report (in English)
description: >-
  Recognition errors, operation abnormalities,
  connection errors, etc.
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before raising the issue...
      description: |
        Please ensure that you have completed the requirements before checking the box.
      options:
        - label: >-
            I understand that Issues are for feedback and problem solving,
            not trolling the comments section, and will provide as
            much information as possible to help solve the problem.
          required: true
        - label: >-
            I filled in a short, clear title
            so that developers could quickly identify the general problem
            when going through the issue list.
            Instead of "Some suggestions", "Stuck", etc.
          required: true
        - label: >-
            I am using the latest version of the current update and have reviewed
            both the updates released so far and the unreleased changes in the Pull Requests,
            there is no mention of the bug being fixed.
          required: true
        - label: >-
            I have reviewed the Pinned issue (Announcements), Open issues, and Closed issues
            to ensure that my issue has not been mentioned.
          required: true
  - type: textarea
    id: describe
    attributes:
      label: Description
      description: Include the task, starting screen, relevant options, steps to reproduce, and the actual and expected results.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: >-
        Please provide the TKFMaa version.
      placeholder: |
        TKFMaa Version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Time of issue and relevant logs (optional)
      description: |
        If you remember when the issue occurred, give the date, approximate time, and time zone.
        After closing TKFMaa, you can share relevant excerpts from `maafw.log` in the project root, rotated logs, or `debug`.
        Include timestamps, the task name, and the lines around the error.
        On macOS, use File → Open Log Folder to find the logs.

        This issue is public. Remove or mask account details, character names, tokens, device serial numbers,
        and personal paths before posting. If settings are relevant, list only the necessary options and their redacted
        values in the report. Do not upload full logs, raw config files, or the entire `debug` directory.
    validations:
      required: false
  - type: textarea
    id: configuration
    attributes:
      label: Configuration information
      description: |
        Please specify the operating system and version, emulator brand, emulator resolution, DPI, and frame rate;
        If you are using MuMu 12 or LDPlayer 9, please specify whether Screenshot Enhancement is enabled;
        Finally, please specify whether GPU accelerated inference is enabled, and if so, provide the GPU model.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Relevant screenshots or recordings (optional)
      description: |
        Share only images or clips that show the issue. Relevant error screenshots may be available in `debug`.
        If the issue is easy to reproduce, you can enable `save_draw` in `config/maa_option.json` and rerun the task
        to capture recognition debug images.
        For recognition issues, use the emulator's screenshot tool or ADB to capture the game screen. Mask private
        information before posting and keep the recognition target visible and the image at its original resolution where possible.
    validations:
      required: false
  - type: textarea
    id: others
    attributes:
      label: Anything else?
      description: |
        Anything that will give us more insight into the problem you are having.
    validations:
      required: false
